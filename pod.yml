apiVersion: v1
kind: Pod
metadata:
  name: todoapp-pod
  namespace: todoapp
  labels:
    app: todoapp
spec:
  containers:
  - name: todoapp
    image: ikulyk404/todoapp:4.0.1
    resources:
      requests:
        memory: "256Mi"
        cpu: "150m"
      limits:
        memory: "256Mi"
        cpu: "150m"
    ports:
    - containerPort: 8080
    env:
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: SECRET_KEY
      value: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
    - name: DB_NAME
      value: "app_db"
    - name: DB_USER
      value: "app_user"
    - name: DB_PASSWORD
      value: "1234"
    - name: DB_HOST
      value: "mysql-0.mysql.mysql.svc.cluster.local"