common:
  namespace: mysql

mysql:

  secrets:
    MYSQL_ROOT_PASSWORD: 1234
    MYSQL_USER: app_user
    MYSQL_PASSWORD: 1234

  replicas: 2

  image:
   name: mysql
   repository: mysql
   version: 8.0

  resources:
   requests:
    storage: 2Gi
    cpu: 500m
    memory: 1Gi

  tolerations:
   - key: "app"
     operator: "Equal"
     value: "mysql"
     effect: "NoSchedule"

  affinity:
    podAntiAffinity:
      key: "app"
      values:
       - mysql
    nodeAffinity:
      key: "app"
      values:
       - mysql